manifest_version: 2          # v2 解析路径（未知字段 warning 而非静默丢弃）
api_version: 2

# 运行时门（plugins_loader.py:430-432 → plugins_manifest.requires_hermes_error）。
# 不满足时 Hermes **干净跳过**：不 import、不 register、不留 traceback。
# 本插件依赖 0.21.5 的 env_enablement_fn 调用约定（gateway/config_env.py:396-437），
# 更早的版本没有这个挂载点 ⇒ 平台永远起不来（见 platform/enablement.py）。
requires_hermes: ">=0.21.5"

# 注册期 hook（plugin/registration.py:118 → ctx.register_hook("pre_llm_call", …)）。
# doctor 拿「实际注册的 hook」与「声明」对账，缺这段会报
#   WARN: registration adds hook 'pre_llm_call' not listed in provides_hooks
provides_hooks:
  - pre_llm_call

# ⚠️ provides_tools 的语义：**逐个「工具名」**，不是 toolset 名。
#    旧版写的是 `- wechatpadpro`（那是 register_tool(..., toolset="wechatpadpro")
#    里的 toolset），属语义用错 —— 触发 plugin_validate 的
#    「REAL − DECLARED 非空 ⇒ 失败」+「DECLARED − REAL 非空 ⇒ WARN」。
#
#    本字段必须与**实际注册**逐名一致；改注册面后要同步更新。
#    CI / 本地可用注册探针核对：declared == actual，多一个或少一个都会被发现。
#    Hermes `hermes plugins validate` 的判据：实注册多 ⇒ FAIL，少 ⇒ WARN。
