# 注册期 hook（plugin/registration.py:118 → ctx.register_hook("pre_llm_call", …)）。
# doctor 拿「实际注册的 hook」与「声明」对账，缺这段会报
#   WARN: registration adds hook 'pre_llm_call' not listed in provides_hooks
provides_hooks:
  - pre_llm_call

# ⚠️ provides_tools 的语义：**逐个「工具名」**，不是 toolset 名。
#    旧版写的是 `- wechatpadpro`（那是 register_tool(..., toolset="wechatpadpro")
#    里的 toolset），属语义用错 —— 触发 plugin_validate 的
#    「REAL − DECLARED 非空 ⇒ 失败」+「DECLARED − REAL 非空 ⇒ WARN」。
#
#    本字段由 tools/gen_provides_tools.py 从**实际注册**生成，禁止手写
#    （deploy.sh 会重新生成并 diff，不为空即中止）。
#
#    2026-10-01 实测：生成器 262 条 == `hermes plugins doctor` 的
#    「registrations: 262 tool(s)」逐条一致（wecom 7 + phoneerp 4 + wpp 251）。
#    2026-10-02：`tools/policy.py` 撤注册 2 个危险工具（对齐 TS 裁决）+ 补注册 1 个
#    setProxy ⇒ **261**（wpp 251 → 250）。
#    2026-10-18：补齐 TS 工具面缺口 33 个 ⇒ **294**（wpp 283 + wecom 7 + phoneerp 4）。
#    本字段已按新注册面重生成。
#    ⚠️ 生成本地是用探针的 gateway 空壳驱动的（注册面不依赖 Hermes 内部），
#    deploy.sh 会在 .183 的**真运行时**再生成一次并 diff —— 不一致即中止。
