description: >
  WeChat Pad protocol gateway adapter for Hermes Agent.
  Registers the ``wechatpadpro`` platform; relays WeChat chats between a
  WeChatPadPro-compatible service (GetQR login, /ws/sync push, /Msg/SendTxt send)
  and the Hermes agent.
  v2.0.0: full Python rewrite — heartflow 9-module port,
  single registration entry, migration-based data layer.

requires_env:
  - name: WECHATPRO_API_BASE
    description: "WeChatPadPro 服务地址（如 https://your-vendor.example）"
    prompt: "WeChatPadPro API base"
  - name: WECHATPRO_AUTHCODE
    description: "vendor authcode (device login token) for default account"
    prompt: "WeChatPadPro authcode"
    secret: true
  - name: WECHATPRO_TOKEN_KEY
    description: "vendor client tokenKey"
    prompt: "WeChatPadPro tokenKey"
    secret: true

optional_env:
  - name: WECHATPRO_WS_URL
    description: >
      WebSocket 地址；留空时按 API base 推导
      （https://host → wss://host/ws/sync）。
    prompt: "WeChatPadPro WebSocket URL"
  - name: WECHATPRO_ALLOWED_USERS
    description: "Comma-separated DM wxids allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
  - name: WECHATPRO_ALLOW_ALL_USERS
    description: >
      Set 1 when dmPolicy/groupPolicy is open, blacklist or pairing — the Hermes
      gateway otherwise default-denies those modes before the plugin sees the
      message. Real filtering still happens per account inside the plugin.
      The setup wizard writes this automatically.
  - name: WECHATPRO_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery (format accountId:peerId)"
    prompt: "Home channel ID"
  - name: WECHATPRO_WEBHOOK_PUBLIC_URL
    description: >
      Public base URL for the vendor to POST inbound webhooks.
      ⚠️ No default is applied — must be set explicitly. A wrong value here
      silently points the vendor's inbound traffic at another host.
    prompt: "Webhook public URL"
  - name: WECHATPRO_DB_BACKEND
    description: >
      Database backend: sqlite (default) or mysql. Unknown values fail loudly —
      no silent fallback. Existing MariaDB deployments must set mysql explicitly
      when upgrading, otherwise they start on an empty SQLite file.
  - name: WECHATPRO_SQLITE_PATH
    description: >
      SQLite file path (default: <plugin dir>/wpp.sqlite3). Ignored when
      WECHATPRO_DB_BACKEND=mysql.
  - name: WECHATPRO_DB_HOST
    description: "MySQL/MariaDB host — only used with WECHATPRO_DB_BACKEND=mysql; must be localhost/127.0.0.1 unless WECHATPRO_DB_ALLOW_REMOTE=1"
  - name: WECHATPRO_DB_PORT
    description: "MySQL/MariaDB port (default 3306)"
  - name: WECHATPRO_DB_USER
    description: "MySQL/MariaDB user"
  - name: WECHATPRO_DB_NAME
    description: "MySQL/MariaDB database name"
  - name: WECHATPRO_DB_PASSWORD
    description: "MySQL/MariaDB password"
    secret: true
  - name: WECHATPRO_OSS_ENABLED
    description: >
      Set 1 to enable OSS media re-upload (public URLs in media messages).
      Default 0: credentials alone are not enough. Requires OSS_ACCESS_KEY_ID,
      OSS_ACCESS_KEY_SECRET and OSS_BUCKET, plus the ossutil binary.
  - name: OSS_ACCESS_KEY_ID
    description: "OSS access key ID (only read when WECHATPRO_OSS_ENABLED=1)"
  - name: OSS_ACCESS_KEY_SECRET
    description: "OSS access key secret (only read when WECHATPRO_OSS_ENABLED=1)"
    secret: true
  - name: OSS_BUCKET
    description: "OSS bucket name"
  - name: OSS_ENDPOINT
    description: "OSS endpoint (implementation default when empty)"
  - name: OSS_CREDENTIALS_PATH
    description: >
      Optional OSS credentials JSON path (legacy fallback). Prefer the OSS_*
      environment variables above.
  - name: JUDGE_API_KEY
    description: >
      Shared LLM key for heartflow's judge model, affection, jargon and style
      (MINIMAX_CN_API_KEY / MINIMAX_API_KEY are accepted as fallbacks).
      Embedding uses the per-account embeddingApiKeyEnv instead.
    secret: true
  - name: JUDGE_BASE_URL
    description: "Optional base URL for the judge model (implementation default when empty)"
  - name: WECHATPRO_STT_API_KEY
    description: >
      SiliconFlow STT key for voice transcription (fallback). Only used when the
      vendor sends no transcript. Requires the silk decoder binary (see
      WPP_SILK_DECODER_PATH in docs). Missing key or decoder degrades loudly once
      (one WARNING), never silently; also accepted: SILICONFLOW_API_KEY.
    prompt: "STT API key"
    secret: true
  - name: WECHATPRO_ACCOUNTS_JSON
    description: >
      Optional: inline account table as JSON, avoiding on-disk credentials.
      Shape: {"<account_id>": {"authcode": "...", "tokenKey": "..."}}
    secret: true

# 声明性 —— Hermes **从不自动安装**（plugins_manifest.py:150-155）。
# 安装脚本需要往 Hermes 的隔离解释器里装：
#   <hermes-python> -m pip install -r <(printf '%s\n' "${DEPS[@]}")
#
# ⚠️ doctor 强制要求**上下界都给**（只写下界会报
#    "entry 'pymysql' has no upper bound"）。上界取下一个大版本。
python_dependencies:
  # ⚠️ 这三条都必须是**运行时真需要**的（声明性字段，Hermes 不自动装，但
  #    `hermes plugins doctor` / install hint 会照着显示）。
  #    aiohttp + websockets 由 `platform/adapter.py:check_wechatpadpro_requirements`
  #    主动探 —— 声明的与探的**必须同源**，否则 check_fn 返 False 而 install_hint
  #    不提真因。
  # 实测版本：aiohttp 3.14.x / websockets 15.x / pymysql 1.2.x —— 上下界按实测取。
  - "aiohttp>=3.9,<4"
  - "websockets>=12,<16"
  - "pymysql>=1.1,<2"
pip_dependencies:
  - "aiohttp>=3.9,<4"
  - "websockets>=12,<16"
  - "pymysql>=1.1,<2"

external_dependencies:
  - name: ffmpeg
    hint: >
      两处**可选但影响体验**：① 出站视频抽首帧做缩略图（vendor /Msg/SendVideo
      的 ImageBase64 必填，抽不到可能被拒收）；② 出站语音转 SILK 的 PCM 前置。
      缺失时视频照发（缩略图留空）、语音降级为**文件**发送。
  - name: silk-encoder
    hint: >
      出站语音 SILK 编码器（WPP_SILK_ENCODER_PATH，默认 ~/silk_decoder/silk/encoder）。
      **缺失时出站语音一律降级为文件** —— 厂商 /Msg/SendVoice 只收 SILK，非 SILK 会被
      静默拒收且回一个文案误导的 Code=-2。
  - name: silk-decoder
    hint: >
      入站语音 SILK 解码器（WPP_SILK_DECODER_PATH，默认 ~/silk_decoder/silk/decoder）
      —— 只在**厂商没给转写**时用得上：解出 PCM → 套 WAV 头 → 送 SiliconFlow 转文字。
      缺失（或 WECHATPRO_STT_API_KEY 未配）时**只降级一次 WARNING**，之后 DEBUG；
      绝不静默 —— 语音转不出字而没人知道，是这条链上最容易踩的坑。

# 本插件不需要任何 capability 授予：
# - 平台注册本身不走能力门（register_platform 无 capability 检查）
# - gateway.platform_actions 只门禁 add_reaction/set_thread_title，且只支持 telegram/discord
capabilities: []
